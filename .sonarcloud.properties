# SonarQube Cloud — Automatic Analysis configuration.
#
# This file (not sonar-project.properties, which Automatic Analysis ignores)
# scopes SonarCloud's Automatic Analysis from the repository, as in the
# sibling extensions nr-vault and cowriter.

# Exclude test code from copy-paste (duplication) detection: mock setup and
# arrange/act/assert scaffolding repeat by design across test methods.
sonar.cpd.exclusions=Tests/**
