name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

# Per-extension test matrix (intentional-drift). Security/quality jobs are in checks.yml.
jobs:
  ci:
    uses: netresearch/typo3-ci-workflows/.github/workflows/ci.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.2","8.3","8.4","8.5"]'
      typo3-versions: '["^12.4","^13.4"]'
      run-functional-tests: true
      upload-coverage: true
      functional-test-db: 'mysql'
      db-image: 'mysql:8.4'
      # netresearch/typo3-ci-workflows requires saschaegerer/phpstan-typo3, whose
      # every release needs typo3/cms-core ^13.4.3 or ^14.0 — so the meta package
      # cannot resolve on the ^12.4 legs. It contributes nothing they need: the
      # phpstan extensions and testing-framework they use are declared in this
      # repository's own require-dev, and Build/phpstan.neon includes them by path.
      remove-dev-deps: '[{"dep":"netresearch/typo3-ci-workflows","only-for":"^13.4|^14.3"}]'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
